services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: nestaprime
      POSTGRES_PASSWORD: nestaprime_dev_password
      POSTGRES_DB: nestaprime_estimator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestaprime"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
