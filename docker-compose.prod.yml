services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nestaprime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nestaprime_estimator
    # No published port -- only reachable by other services on this
    # compose network, unlike docker-compose.yml's dev db (which binds
    # 5432 to the host for local tooling to connect directly).
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestaprime"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Lets a deploy run a PRE-BUILT image (`up -d --no-build`). The default tag is mutable and proves
    # nothing: a release must set BACKEND_IMAGE to an immutable reference (a digest, or a unique tag plus
    # the recorded image ID) and verify the running container's image ID matches it.
    image: ${BACKEND_IMAGE:-nestaprime-backend:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ENVIRONMENT: production
      # Amendment 8 (Section 8): the company's self-hosted WhatsApp
      # backend, deployed separately on this same host (see wa-gateway's
      # own docker-compose.yml) -- reached over loopback, same pattern as
      # this backend container itself only binding 127.0.0.1. All four
      # blank (unset in the host .env) disables real WhatsApp/Telegram
      # sending -- Messages fall back to a fast FAILED instead of hanging.
      WA_GATEWAY_BASE_URL: ${WA_GATEWAY_BASE_URL:-}
      WA_GATEWAY_API_KEY: ${WA_GATEWAY_API_KEY:-}
      WA_GATEWAY_WEBHOOK_SECRET: ${WA_GATEWAY_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Upload hardening (docs/security/upload-hardening.md). Defaults mirror app/config.py:
      # unscanned uploads accepted (a logged warning is NOT malware protection). Set
      # UPLOAD_SCAN_REQUIRED=true to refuse every upload until a verified scanner is configured.
      UPLOAD_SCAN_COMMAND: ${UPLOAD_SCAN_COMMAND:-}
      UPLOAD_SCAN_REQUIRED: ${UPLOAD_SCAN_REQUIRED:-false}
      UPLOAD_SCAN_TIMEOUT_SECONDS: ${UPLOAD_SCAN_TIMEOUT_SECONDS:-120}
      # 50 GiB default; set from the measured disk (stored attachments + open reservations).
      ATTACHMENT_STORAGE_CAP_BYTES: ${ATTACHMENT_STORAGE_CAP_BYTES:-53687091200}
    # Bound to localhost only -- the public-facing side is the host's own
    # nginx (deploy/nginx/nestaprime.conf), which reverse-proxies /api/
    # here. The backend container is never directly internet-reachable.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_uploads:/app/uploads

volumes:
  pgdata_prod:
  backend_uploads:
