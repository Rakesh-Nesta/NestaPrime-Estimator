services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nestaprime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nestaprime_estimator
    # No published port -- only reachable by other services on this
    # compose network, unlike docker-compose.yml's dev db (which binds
    # 5432 to the host for local tooling to connect directly).
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestaprime"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ENVIRONMENT: production
    # Bound to localhost only -- the public-facing side is the host's own
    # nginx (deploy/nginx/nestaprime.conf), which reverse-proxies /api/
    # here. The backend container is never directly internet-reachable.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_uploads:/app/uploads

volumes:
  pgdata_prod:
  backend_uploads:
