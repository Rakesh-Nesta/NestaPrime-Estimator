Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
MaxThreads 1
MaxQueue 4
MaxConnectionQueueLength 4
ConcurrentDatabaseReload no
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 400M
MaxRecursion 17
MaxFiles 10000
AlertExceedsMax yes
ReadTimeout 120
CommandReadTimeout 30
SelfCheck 600
LogTime yes
