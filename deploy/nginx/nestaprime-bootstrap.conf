# Bootstrap nginx config -- HTTP only, used for ONE step of the HTTPS cutover
# (Amendment 55, Section 59): getting the Let's Encrypt certificate.
#
# The final config (nestaprime.conf) points at certificate files that do not exist until
# certbot has run, and certbot's challenge needs a working HTTP site on the domain -- so
# this is the old plain-HTTP site plus the challenge path and the domain in server_name,
# with no redirect. The app keeps working over HTTP while the certificate is obtained.
#
# Install with the domain filled in:
#   sed "s/__DOMAIN__/your.domain.example/g" deploy/nginx/nestaprime-bootstrap.conf \
#     | sudo tee /etc/nginx/sites-available/nestaprime > /dev/null
# Then `sudo nginx -t && sudo systemctl reload nginx`. Once the certificate exists, replace it
# with nestaprime.conf (see "Cutover to HTTPS" in the README).

server {
    listen 80;
    server_name __DOMAIN__ 65.1.234.78;

    root /var/www/nestaprime/dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
