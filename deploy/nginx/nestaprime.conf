# Reference nginx config for the Lightsail deploy (deploy/README.md) -- the HTTPS site.
# Amendment 55 (Section 59): HTTPS on a real domain.
#
# Install with the domain filled in (never copy this file as it is):
#   sed "s/__DOMAIN__/your.domain.example/g" deploy/nginx/nestaprime.conf \
#     | sudo tee /etc/nginx/sites-available/nestaprime > /dev/null
# The certificate files below exist only after certbot has run against the bootstrap
# config (deploy/nginx/nestaprime-bootstrap.conf) -- see "Cutover to HTTPS" in the README.
# Run `sudo nginx -t` before every reload.

# Amendment 58 (Section 61) item 2: request throttling, per client address, answering 429. Two zones:
# the sign-in (10 a minute) and the rest of the API (20 a second). The office shares one public address,
# so the numbers sit well above what a team signing in at 9 a.m. does; change them here, one place.
# The map gives the sign-in zone a key only for the sign-in path -- a request with an empty key is never limited.
map $uri $nestaprime_login_key {
    default          "";
    /api/auth/login  $binary_remote_addr;
}
limit_req_zone $nestaprime_login_key   zone=nestaprime_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr     zone=nestaprime_api:10m   rate=20r/s;
limit_req_status 429;
limit_req_log_level warn;

# Plain HTTP does exactly two things: answers Let's Encrypt's challenge, and sends
# everyone else to HTTPS. It serves no application content.
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The bare IP, so old bookmarks and typed addresses move to the domain.
server {
    listen 80 default_server;
    server_name 65.1.234.78;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Strict-Transport-Security: 180 days (15552000 s). It was staged -- five minutes for the first
    # verified run -- and raised at the Director's instruction on 2026-09-25 (Amendment 55). From now a
    # browser that has visited refuses plain HTTP to this host for 180 days, so the site cannot be rolled
    # back to HTTP for those browsers, and an expired certificate cannot be clicked through: the
    # certificate must keep renewing (certbot renew --dry-run; the reload hook in the README). Deliberately
    # no includeSubDomains and no preload: nothing beyond this one host is committed.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Amendment 58 (Section 61) item 1. Content-Security-Policy: scripts only from this site; styles from
    # this site, Google Fonts and inline style attributes (React's style={{...}}); fonts from Google's font
    # host; images from this site plus data:/blob: (the logo and previews are blob URLs); connections only
    # back to this site. No plugins, no <base> tricks, no form posts elsewhere, never framed. The app uses no
    # camera, microphone, location or payment API, so Permissions-Policy turns them off.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    server_tokens off;

    root /var/www/nestaprime/dist;
    index index.html;

    # Amendment 58 item 3: 2 MB everywhere by default. nginx's own default (1 MB) is smaller than the
    # app's real upload limits, so the routes that take files get their own, matching the limit the
    # backend enforces (nested locations below): M.3 attachments 100 MB (attachments.py MAX_FILE_SIZE_BYTES),
    # the company logo 5 MB (company.py MAX_LOGO_SIZE_BYTES, 6 MB here), and the two spreadsheet imports.
    # Without a matching limit nginx would answer a raw 413 before the backend's own message.
    client_max_body_size 2M;

    # Amendment 58 item 4: the API's own documentation pages are not for the public.
    # (/api/openapi.json stays readable -- see the spec, decision 2.)
    location ~ ^/api/(docs|redoc)(/|$) {
        return 404;
    }

    # Trailing slash on both sides matters: it strips the /api prefix
    # when forwarding, since the backend's own routes (/auth/login,
    # /sports, ...) carry no /api prefix themselves.
    location /api/ {
        limit_req zone=nestaprime_login burst=10 nodelay;
        limit_req zone=nestaprime_api   burst=100 nodelay;

        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Only nginx sits in front of the backend, so the client's address is $remote_addr -- not
        # $proxy_add_x_forwarded_for, which would keep whatever X-Forwarded-For a client sent and let
        # it choose the address the backend records (attachment uploads store it).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend sets its own X-Content-Type-Options; nginx sets it above, so drop the
        # backend's copy rather than send the header twice.
        proxy_hide_header X-Content-Type-Options;

        # Nested locations inherit the proxy settings and throttles above; each only changes the body limit.
        location /api/attachments {
            client_max_body_size 100M;
            proxy_pass http://127.0.0.1:8000/attachments;
        }
        location = /api/company/logo {
            client_max_body_size 6M;
            proxy_pass http://127.0.0.1:8000/company/logo;
        }
        location = /api/rate-items/import {
            client_max_body_size 10M;
            proxy_pass http://127.0.0.1:8000/rate-items/import;
        }
        location = /api/settings/import {
            client_max_body_size 10M;
            proxy_pass http://127.0.0.1:8000/settings/import;
        }
    }

    # SPA fallback -- any path not matched above (client-side routing)
    # serves index.html instead of a raw 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
