# Reference nginx config for the Lightsail deploy (deploy/README.md).
# Copy to /etc/nginx/sites-available/nestaprime on the server -- paths
# below assume that install location.

server {
    listen 80;
    server_name 65.1.234.78;

    root /var/www/nestaprime/dist;
    index index.html;

    # nginx's own default (1 MB) is smaller than every app-level upload
    # limit this backend enforces -- Company Logo (company.py,
    # MAX_LOGO_SIZE_BYTES, 5 MB) and M.3 Attachments (attachments.py,
    # MAX_FILE_SIZE_BYTES, 100 MB). Without this, nginx rejects a file
    # between 1 MB and the app's own limit with a raw 413 before the
    # request ever reaches FastAPI's own validation -- found live trying
    # to upload a ~2 MB company logo. Set to the larger of the two limits
    # so nginx never becomes the tighter gate.
    client_max_body_size 100M;

    # Trailing slash on both sides matters: it strips the /api prefix
    # when forwarding, since the backend's own routes (/auth/login,
    # /sports, ...) carry no /api prefix themselves.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback -- any path not matched above (client-side routing)
    # serves index.html instead of a raw 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
