name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nestaprime
          POSTGRES_PASSWORD: nestaprime_dev_password
          POSTGRES_DB: nestaprime_estimator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nestaprime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://nestaprime:nestaprime_dev_password@localhost:5432/nestaprime_estimator_test
          SECRET_KEY: ci-only-secret-not-for-real-use
        run: python -m pytest tests/ -v
